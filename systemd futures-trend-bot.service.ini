[Unit]
Description=Futures Trend Bot
After=network-online.target

[Service]
Type=simple
User=bot
WorkingDirectory=/opt/futures_trend_bot
EnvironmentFile=/opt/futures_trend_bot/.env
ExecStart=/opt/futures_trend_bot/.venv/bin/python -m src.main
Restart=on-failure
RestartSec=5
KillSignal=SIGTERM
TimeoutStopSec=30

[Install]
WantedBy=multi-user.target